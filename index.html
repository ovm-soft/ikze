<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title"></title>
    <link rel="icon" type="image/x-icon" href="/ikze/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        input[type="range"] {
            accent-color: #16a34a;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full min-h-screen flex flex-col justify-between">

<header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div>
                <h1 data-i18n="title" class="text-lg font-bold tracking-tight text-slate-900"></h1>
                <p data-i18n="subtitle" class="text-xs text-slate-500"></p>
                <p class="text-xs text-slate-500">gov.pl/web/rodzina/ikze-indywidualne-konto-zabezpieczenia-emerytalnego</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <label for="themeSelector" class="text-xs font-medium text-slate-600 hidden sm:inline">Styl / Motyw:</label>
            <select id="themeSelector" onchange="changeTheme(this.value)" class="text-xs bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option data-i18n="theme_1" value="emerald"></option>
                <option data-i18n="theme_2" value="ocean"></option>
                <option data-i18n="theme_3" value="sunset"></option>
                <option data-i18n="theme_4" value="dark"></option>
            </select>
        </div>

        <div class="flex items-center space-x-3">
            <label for="langSelector" class="text-xs font-medium text-slate-600 hidden sm:inline">Język / Language:</label>
            <select id="langSelector" onchange="changeLanguage(this.value)" class="text-xs bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="pl" selected>🇵🇱 Polski</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Panel boczny: Parametry -->
        <section class="lg:col-span-5 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span data-i18n="label_input_params"></span>
                    </h2>
                    <button data-i18n="reset_default_btn" onclick="resetDefaults()" class="text-xs text-brand-600 hover:text-brand-700 font-semibold underline"></button>
                </div>

                <div class="space-y-5">
                    <!-- Czas dokonywania wpłat -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label data-i18n="label_years" for="czasWplatRange" class="text-sm font-medium text-slate-700"></label>
                            <span id="czasWplatVal" class="text-sm font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded"></span>
                        </div>
                        <input type="range" id="czasWplatRange" min="5" max="45" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer"
                               oninput="syncSelectedValueLabel('czasWplatVal', this.value)">
                        <p data-i18n="label_years_rules" class="text-xs text-slate-500 mt-1"></p>
                    </div>

                    <!-- Wpłata roczna na IKZE -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label data-i18n="label_annual_deposit" for="oplataRocznaInput" class="text-sm font-medium text-slate-700"></label>
                            <span id="oplataRocznaVal" class="text-sm font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded"></span>
                        </div>
                        <input type="range" id="oplataRocznaRange" step="1" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer"
                               oninput="limitInputMinMax('oplataRoczna', 'oplataRocznaRange'); syncSelectedValueLabel('oplataRocznaVal', this.value); syncRelatedInput('oplataRocznaInput', this.value)">
                        <input type="number" id="oplataRocznaInput" step="500" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-brand-500 focus:outline-none"
                               onfocusout="limitInputMinMax('oplataRoczna', 'oplataRocznaInput'); syncSelectedValueLabel('oplataRocznaVal', this.value); syncRelatedInput('oplataRocznaRange', this.value)">
                    </div>

                    <!-- Stawka podatku PIT -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label data-i18n="label_tax_rate" for="stawkaPit" class="text-sm font-medium text-slate-700"></label>
                        </div>
                        <select id="stawkaPit" onchange="calculate()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                            <option data-i18n="label_tax_rate_12" value="12" selected></option>
                            <option data-i18n="label_tax_rate_32" value="32"></option>
                            <option data-i18n="label_tax_rate_19" value="19"></option>
                        </select>

                        <p data-i18n="tax_rate_nuance_1" class="text-xs text-slate-500 mt-1"></p>
                        <p data-i18n="tax_rate_nuance_2" class="text-xs text-slate-500 mt-1"></p>
                        <p data-i18n="tax_rate_nuance_3" class="text-xs text-slate-500 mt-1"></p>
                        <p data-i18n="tax_rate_nuance_4" class="text-xs text-slate-500 mt-1"></p>
                    </div>

                    <!-- Stopa zwrotu inwestycji -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label data-i18n="label_return_rate" for="stopaZwrotuRange" class="text-sm font-medium text-slate-700"></label>
                            <span id="stopaZwrotuVal" class="text-sm font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded"></span>
                        </div>
                        <input type="range" id="stopaZwrotuRange" min="0" max="15" step="0.1" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer"
                               oninput="syncSelectedValueLabel('stopaZwrotuVal', this.value)">
                    </div>
                    <!-- Typ obliczania odsetek -->
                    <div>
                        <label data-i18n="label_return_calculation_type" class="text-sm font-medium text-slate-700 block mb-2"></label>
                        <div class="flex flex-col sm:flex-row gap-2 sm:gap-4">
                            <label class="flex items-center gap-2 px-3 py-2 border border-slate-300 rounded-lg cursor-pointer hover:bg-brand-50 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50">
                                <input type="radio" name="typAkumulacji" id="typAkumulacjiTak" value="z_akumulacja" checked
                                       onchange="calculate()" class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-slate-300">
                                <span data-i18n="radio_return_calculation_type_accu" class="text-sm font-semibold text-slate-700"></span>
                            </label>
                            <label class="flex items-center gap-2 px-3 py-2 border border-slate-300 rounded-lg cursor-pointer hover:bg-brand-50 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50">
                                <input type="radio" name="typAkumulacji" id="typAkumulacjiNie" value="bez_akumulacji"
                                       onchange="calculate()" class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-slate-300">
                                <span data-i18n="radio_return_calculation_type_simple" class="text-sm font-semibold text-slate-700"></span>
                            </label>
                        </div>
                        <p data-i18n="return_calculation_type_comment" class="text-xs text-slate-500 mt-1"></p>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-4 border-t border-slate-100 text-xs text-slate-400 text-center">
                <span data-i18n="title"></span> &bull;
                <span data-i18n="env_no_server"></span> &bull;
                <span data-i18n="env_local"></span>
            </div>
        </section>

        <!-- Wyniki symulacji -->
        <section class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold text-slate-900 pb-4 mb-6 border-b border-slate-100 flex items-center justify-between">
                    <span data-i18n="results_title"></span>
                </h2>

                <!-- Tabela wyników -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-slate-100 transition-colors">
                                <td class="py-3.5 pr-4 text-sm font-bold text-slate-700"></td>
                                <td data-i18n="ikze" class="underline py-3.5 pl-4 text-sm font-bold text-center text-slate-700"></td>
                                <td class="py-3.5 pl-4 text-sm font-bold text-center text-slate-700" title="19% Belki, bez ulgi podatkowej">
                                    <span data-i18n="results_no_ikze" class="underline decoration-slate-400 decoration-dotted underline-offset-4 hover:decoration-slate-600 transition-colors"></span>
                                    <span class="cursor-help text-slate-400 font-normal">ⓘ</span>
                                </td>
                            </tr>
                        </thead>
                        <tbody>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-slate-100 transition-colors">
                            <td data-i18n="results_label_years_2" class="py-3.5 pr-4 text-sm font-medium text-slate-700"></td>
                            <td id="resCzasIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900"></td>
                            <td id="resCzasNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900"></td>
                        </tr>

                        <tr class="bg-blue-100/50 border-y border-blue-200">
                            <th data-i18n="results_deposits_section" colspan="3" class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-blue-900 text-left"></th>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-slate-100 transition-colors">
                            <td data-i18n="results_1_year" class="py-3.5 pr-4 text-sm font-medium text-slate-700"></td>
                            <td id="resOplataRocznaIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900"></td>
                            <td id="resOplataRocznaNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900"></td>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-blue-50/75 transition-colors">
                            <td data-i18n="results_all_years" class="py-3.5 pr-4 text-sm font-medium text-blue-700"></td>
                            <td id="resOplataCalyCzasIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-blue-700 relative overflow-hidden"></td>
                            <td id="resOplataCalyCzasNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-blue-700 relative overflow-hidden"></td>
                        </tr>

                        <tr class="bg-emerald-100/50 border-y border-emerald-200">
                            <th data-i18n="results_tax_deduction" colspan="3" class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-emerald-900 text-left"></th>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-emerald-50/60 transition-colors">
                            <td data-i18n="results_1_year" class="py-3.5 pr-4 text-sm font-medium text-slate-700"></td>
                            <td id="resUlgaRoczna" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900 relative overflow-hidden"></td>
                            <td data-i18n="results_na" class="py-3.5 pl-4 text-sm font-bold text-right text-slate-900 relative overflow-hidden"></td>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-emerald-50/80 transition-colors">
                            <td data-i18n="results_all_years" class="py-3.5 pr-4 text-sm font-medium text-emerald-700"></td>
                            <td id="resUlgaOkres" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden"></td>
                            <td data-i18n="results_na" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden"></td>
                        </tr>

                        <tr class="bg-blue-100/50 border-y border-blue-200">
                            <th data-i18n="results_invest" colspan="3" class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-blue-900 text-left"></th>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-blue-50/75 transition-colors">
                            <td data-i18n="results_all_years_earn" class="py-3.5 pr-4 text-sm font-medium text-blue-700"></td>
                            <td id="resZarobkiIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-blue-700 relative overflow-hidden"></td>
                            <td id="resZarobkiNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-blue-700 relative overflow-hidden"></td>
                        </tr>

                        <tr class="bg-emerald-100/50 border-y border-emerald-200">
                            <th data-i18n="results_summary" colspan="3" class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-emerald-900 text-left"></th>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-emerald-50/80 transition-colors">
                            <td data-i18n="results_final_benefit_brutto" class="py-3.5 pr-4 text-sm font-medium text-emerald-700"></td>
                            <td id="resKapitalKoncowyIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden"></td>
                            <td id="resKapitalKoncowyNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden border-l-2 border-white"></td>
                        </tr>
                        <tr class="border-b border-slate-100 bg-red-50/40 hover:bg-red-50/70 transition-colors">
                            <td data-i18n="results_10_percent_tax" class="py-3.5 pr-4 text-sm font-medium text-red-900"></td>
                            <td id="resWyplataPodatek" class="py-3.5 pl-4 text-sm font-bold text-right text-red-700 relative overflow-hidden"></td>
                            <td data-i18n="results_na" class="py-3.5 pl-4 text-sm font-bold text-right text-red-700 relative overflow-hidden"></td>
                        </tr>
                        <tr class="border-b border-slate-100 bg-slate-50/50 hover:bg-emerald-50/80 transition-colors">
                            <td data-i18n="results_final_benefit_netto" class="py-3.5 pr-4 text-sm font-medium text-emerald-700"></td>
                            <td id="kapitalKoncowyPoRyczalcieIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden"></td>
                            <td id="kapitalKoncowyPoRyczalcieNoIKZE" class="py-3.5 pl-4 text-sm font-bold text-right text-emerald-700 relative overflow-hidden"></td>
                        </tr>
                        <tr class="hover:bg-amber-100 transition-colors bg-amber-100/60 font-semibold border-t-2 border-brand-200">
                            <td class="uppercase tracking-wider py-4 px-4 text-base text-brand-900 font-bold">
                                <span data-i18n="results_total_benefit"></span>
                                <p data-i18n="results_total_benefit_comment" class="text-xs text-slate-500 mt-1"></p>
                            </td>
                            <td id="resCalkowitaKorzyscIKZE" class="py-4 pl-4 text-base text-right text-brand-800 font-extrabold relative overflow-hidden"></td>
                            <td id="resCalkowitaKorzyscNoIKZE" class="py-4 pl-4 text-base text-right text-brand-800 font-extrabold relative overflow-hidden"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-100 flex flex-wrap gap-3 justify-end">
                <button onclick="window.print()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    <span data-i18n="results_print"></span>
                </button>
            </div>
        </section>

        <!-- Sekcja information -->
        <section class="lg:col-span-12 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-between">
            <h2 data-i18n="info_title" class="text-xl font-bold text-slate-900 pb-4 mb-6 border-b border-slate-100"></h2>

            <div class="space-y-6 text-slate-700 leading-relaxed text-base">
                <p class="text-lg text-slate-800 font-medium">
                    <strong data-i18n="ikze"></strong> <span data-i18n="info_ikze_is"></span>
                </p>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h3 class="font-semibold text-slate-900 mb-2">🌟 <span data-i18n="info_main_pros"></span></h3>
                    <ul class="list-disc pl-5 space-y-1">
                        <li><strong data-i18n="info_zwrot_podatku"></strong> <span data-i18n="info_zwrot_podatku_text"></span></li>
                        <li><strong data-i18n="info_brak_belki"></strong> <span data-i18n="info_brak_belki_text"></span></li>
                    </ul>
                </div>

                <div>
                    <h3 class="font-semibold text-slate-900 mb-2">💰 <span data-i18n="info_co_jeszcze_warto"></span></h3>
                    <ul class="list-disc pl-5 space-y-1">
                        <li><span data-i18n="info_kwoty_od_100"> </span><strong>100 zł</strong>.</li>
                        <li data-i18n="info_max_limit"></li>
                        <li data-i18n="info_osoby_uprawnione"></li>
                    </ul>
                </div>

                <div>
                    <h3 class="font-semibold text-slate-900 mb-3">🔄 <span data-i18n="info_wyplata_zwrot_transfer"></span></h3>
                    <div class="grid gap-3 sm:grid-cols-3">
                        <div class="p-3 bg-emerald-50 border border-emerald-100 rounded-lg">
                            <span data-i18n="info_wyplata" class="font-bold text-emerald-900 block mb-1"></span>
                            <span data-i18n="info_wyplata_1" class="text-xs text-emerald-800"></span>
                        </div>
                        <div class="p-3 bg-amber-50 border border-amber-100 rounded-lg">
                            <span data-i18n="info_zwrot" class="font-bold text-amber-900 block mb-1"></span>
                            <span data-i18n="info_zwrot_1" class="text-xs text-amber-800"></span>
                        </div>
                        <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg">
                            <span data-i18n="info_transfer" class="font-bold text-blue-900 block mb-1"></span>
                            <span data-i18n="info_transfer_1" class="text-xs text-blue-800"></span>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4 text-sm text-slate-600">
                    <h3 class="font-semibold text-slate-900 mb-1">🎒 <span data-i18n="info_16_lat"></span></h3>
                    <p data-i18n="info_16_lat_nuance"></p>
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="bg-white border-t border-slate-200 mt-12 py-6">
    <div data-i18n="footer_local" class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500"></div>
</footer>

<script src="theme.js"></script>
<script src="i18n.js"></script>
<script src="calc.js"></script>
